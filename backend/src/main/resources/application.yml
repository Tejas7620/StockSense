spring:
  application:
    name: stocksense-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/stocksense;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatShouldBeChangedInProductionAndMustBeAtLeast256BitsLong!!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    delivery-mode: ${OTP_DELIVERY_MODE:DEMO}
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.stocksense: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
